.top { display: grid; gap: 6px; }

.ttl b { color: var(--fg); font-size: 15px; font-weight: 800; letter-spacing: -0.01em; }
.pick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }

  padding: 7px 0 6px; display: grid; justify-items: center; gap: 5px; cursor: pointer; min-width: 0; }
