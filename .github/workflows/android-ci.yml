# Builds, tests and screenshots every change before it reaches the owner's phone.
# Runs on GitHub's Ubuntu machines, which already carry the Android SDK.
name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Private-repo runners have about 7 GB of memory: one Gradle JVM, Kotlin compiled in it, Robolectric forks capped in the build files.
  GRADLE_ARGS: >-
    --stacktrace --continue
    -Dorg.gradle.jvmargs=-Xmx3g
    -Pkotlin.compiler.execution.strategy=in-process

jobs:
  build-and-test:
    name: Build, unit and screenshot tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APKs
        run: ./gradlew $GRADLE_ARGS :app:assembleDebug :lab:assembleDebug

      - name: Unit, logic and rendered-screen tests
        run: ./gradlew $GRADLE_ARGS :domain:test :app:testDebugUnitTest :lab:testDebugUnitTest

      - name: Lint
        if: ${{ !cancelled() }}
        run: ./gradlew $GRADLE_ARGS :app:lintDebug :lab:lintDebug

      - name: Summary
        if: ${{ !cancelled() }}
        run: python3 .github/scripts/summary.py >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APKs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk/debug/*.apk
            lab/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: lab/build/trace-stills/
          if-no-files-found: warn
      - name: Upload test and lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            */build/reports/
            */build/test-results/
          if-no-files-found: warn

  emulator-smoke:
    name: Install, launch and tap-test on an emulator
    needs: build-and-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: apks
          path: apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke test on Android 14 (x86_64, ARM translation for the arm64-only lab)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/smoke.sh
      - name: Summary
        if: ${{ !cancelled() }}
        run: cat smoke/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload emulator screenshots and logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke
          path: smoke/
          if-no-files-found: warn
